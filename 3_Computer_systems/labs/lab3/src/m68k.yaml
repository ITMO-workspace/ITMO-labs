name: "assert glob_match('*.txt\nfile.txt\n') == ([1], '')"
limit: 4000
memory_size: 0x1000
memory_mapped_io:
  0x80: [42, 46, 116, 120, 116, 10, 102, 105, 108, 101, 46, 116, 120, 116, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc:hex}:	{instruction:next}	D0: {D0:dec}	D1: {D1:hex}	A7: {A7:hex}	{pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "?"
  - name: Statistics
    slice: last
    view: |
      instructions: {sim:instruction-count}
      memory accesses: {mem:accesses-total}