name: "assert sum_odd_n(90000) == 2025000000"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [90000]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc:hex}:	{instruction:next}	a0: {a0:dec}	t0: {t0:dec}	sp: {sp:hex}	ra: {ra:hex}	{pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [2025000000]
  - name: Statistics
    slice: last
    view: |
      instructions: {sim:instruction-count}
      memory accesses: {mem:accesses-total}